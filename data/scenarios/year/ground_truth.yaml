# Duties no record states, found by code from repetition (Phase 17): the same task done at about
# the same time of year in 2024-25 and in 2025-26. Each occurrence is the first record that it
# was done (`done`) and the first record that it was under way (`start`); the lead time is the
# longest gap between the two, in IST calendar days, and the dates are for `built.today`
# (2026-11-10): due a year after it was last done, start that many days before.
inferred:
  - id: I1
    duty: Send the sponsorship proposal to Brightwave Labs
    expectedNextDue: 2027-01-21
    expectedStartBy: 2027-01-10
    leadDays: 11
    occurrences:
      - { year: 2025, done: { file: whatsapp-committee-2024-25.txt, text: "Sent the sponsorship proposal to Brightwave Labs today." }, start: { file: whatsapp-committee-2024-25.txt, text: "I'll send the sponsorship proposal to Brightwave Labs by 15 January." } }
      - { year: 2026, done: { file: whatsapp-committee.txt, text: "Sponsorship proposal sent to Brightwave Labs this morning." }, start: { file: whatsapp-committee.txt, text: "I'll send the sponsorship proposal to Brightwave Labs by 20 January." } }
  - id: I2
    duty: Return the borrowed ESP32 boards to Bala sir
    expectedNextDue: 2027-02-27
    expectedStartBy: 2027-02-12
    leadDays: 15
    occurrences:
      - { year: 2025, done: { file: whatsapp-committee-2024-25.txt, text: "Returned the ESP32 boards to Bala sir today, he signed the register." }, start: { file: whatsapp-committee-2024-25.txt, text: "I'll return the ESP32 boards to Bala sir by 28 Feb." } }
      - { year: 2026, done: { file: whatsapp-committee.txt, text: "Returned all 8 boards, Bala sir signed the register." }, start: { file: whatsapp-committee.txt, text: "I'll return the borrowed ESP32 boards to Bala sir by Friday 27 Feb." } }
  - id: I3
    duty: Put up the recruitment posters in the first-year blocks
    expectedNextDue: 2027-09-08
    expectedStartBy: 2027-08-20
    leadDays: 19
    occurrences:
      - { year: 2025, done: { file: whatsapp-committee-2024-25.txt, text: "Recruitment posters are up in all the first-year blocks." }, start: { file: whatsapp-committee-2024-25.txt, text: "I'll put up the recruitment posters in the first-year blocks by 5 September." } }
      - { year: 2026, done: { file: trello-board.json, text: "Moved card \"Recruit new members\" from \"To Do\" to \"Done\"" }, start: { file: trello-board.json, text: "Card: Recruit new members" } }
  - id: I4
    duty: Make the IoT basics workshop slides
    expectedNextDue: 2026-11-27
    expectedStartBy: 2026-11-10
    leadDays: 17
    note: Due a fortnight after the handover; its start-by date is the handover day.
    occurrences:
      - { year: 2024, done: { file: whatsapp-committee-2024-25.txt, text: "IoT basics workshop slides are done, shared them in the drive." }, start: { file: whatsapp-committee-2024-25.txt, text: "I'll make the IoT basics workshop slides by 25 November." } }
